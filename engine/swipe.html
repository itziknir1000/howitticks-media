<style>@font-face{font-family:Poppins;src:url(assets/Poppins-Bold.ttf);font-weight:700}@font-face{font-family:Poppins;src:url(assets/Poppins-Medium.ttf);font-weight:500}html,body{margin:0;background:#000;overflow:hidden}canvas{position:absolute;left:0;top:0}</style>

</head><body><canvas id="ui" width="1080" height="1920" style="z-index:2"></canvas>
<script>window.LANG_EN = true;</script>
<script type="module">
// Swiping apps closed. One visual thread: the amber power stream from the battery to the chip inside an x-ray phone.
// frame 0: a card is flicked away and the stream surges → frozen cards, stream stops → swipe one, it rebuilds from scratch, chip glows hot →
// navigation keeps the stream running (the real drain) → Settings › Battery list → mirror: swiping = start over.
import { makeToon } from './toon.js';
import { THREE, RoundedBoxGeometry, W, H, clamp, lerp, eio, eo, seg, scene, cam, composer, bloom, key, ui, canvasTex, note } from './common.js';
import { B, installTimeline, stage, glowSprite, camAt, line, superAt, foot, signature, sigEvents, filmLook, eventsHelper, CY, RD, AM, PU } from './hit.js';

bloom.threshold = 0.8; bloom.strength = 0.6; bloom.radius = 0.55; key.intensity = 0.55; key.castShadow = false;
stage();
const PX = 0.18, PY = 0.92, PWD = 0.92, PHT = 1.84; // phone centre / size
const glass = (op = 0.4, col = '#0d1640') => new THREE.MeshPhysicalMaterial({ color: col, metalness: 0.2, roughness: 0.25, transparent: true, opacity: op, side: THREE.DoubleSide, depthWrite: false, emissive: '#0a1030', emissiveIntensity: 0.7 });
const edge = (g, col = CY, op = 0.6) => new THREE.LineSegments(new THREE.EdgesGeometry(g, 20), new THREE.LineBasicMaterial({ color: col, transparent: true, opacity: op, toneMapped: false }));

// ---------- YOU ----------
const guy = makeToon({ skin: '#f2c29b', hair: '#2b1d16', shirt: '#3a6df0', pants: '#1f2547', shoes: '#c94a3a', hairStyle: 'cap' });
guy.root.position.set(-0.62, 0, -0.25); guy.root.rotation.y = 0.55; guy.root.scale.setScalar(0.8); scene.add(guy.root);

// ---------- the x-ray phone ----------
const phone = new THREE.Group(); phone.position.set(PX, PY, 0); phone.rotation.y = -0.12; phone.scale.setScalar(0.87); scene.add(phone);
{ const g = new RoundedBoxGeometry(PWD, PHT, 0.08, 4, 0.08); phone.add(new THREE.Mesh(g, glass(0.3))); phone.add(edge(g, CY, 0.6)); }
// chip (top) and battery (bottom) inside
const CHY = 0.66, BTY = -0.66;
const chipM = new THREE.MeshStandardMaterial({ color: '#1b1f55', emissive: AM, emissiveIntensity: 0.0, roughness: 0.4 });
const chip = new THREE.Mesh(new THREE.BoxGeometry(0.26, 0.26, 0.04), chipM); chip.position.set(0, CHY, -0.01); phone.add(chip); { const e = edge(chip.geometry, '#c8d4ff', 0.8); e.position.copy(chip.position); phone.add(e); }
const chipGlow = glowSprite('rgba(255,181,71,1)', 0.9, 0); chipGlow.position.set(0, CHY, 0.02); phone.add(chipGlow);
const bat = new THREE.Group(); bat.position.set(0, BTY, -0.01); phone.add(bat);
{ const g = new THREE.BoxGeometry(0.6, 0.3, 0.04); bat.add(edge(g, '#9fb4ff', 0.8)); const m = new THREE.Mesh(g, glass(0.25, '#10205a')); bat.add(m); }
const batFill = new THREE.Mesh(new THREE.BoxGeometry(0.56, 0.26, 0.03), new THREE.MeshBasicMaterial({ color: CY, transparent: true, opacity: 0.55, toneMapped: false })); bat.add(batFill);
// the power trace (thread)
const TR = [new THREE.Vector3(0.36, BTY, 0.0), new THREE.Vector3(0.38, -0.2, 0.0), new THREE.Vector3(0.38, 0.4, 0.0), new THREE.Vector3(0.13, CHY, 0.0)];
const trace = new THREE.CatmullRomCurve3(TR);
const traceM = new THREE.LineBasicMaterial({ color: AM, transparent: true, opacity: 0.35, toneMapped: false });
phone.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(trace.getPoints(60)), traceM));
const T2 = new THREE.CatmullRomCurve3([new THREE.Vector3(-0.27, -0.02, 0.0), new THREE.Vector3(-0.3, 0.35, 0.0), new THREE.Vector3(-0.13, CHY - 0.02, 0.0)]); const t2M = new THREE.LineBasicMaterial({ color: RD, transparent: true, opacity: 0, toneMapped: false }); phone.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(T2.getPoints(40)), t2M)); const F2 = []; for (let i = 0; i < 16; i++) { const s = glowSprite('rgba(255,90,110,1)', 0.07, 0); phone.add(s); F2.push(s); }
const NF = 40, FL = []; for (let i = 0; i < NF; i++) { const s = glowSprite('rgba(255,181,71,1)', 0.07, 0); phone.add(s); FL.push(s); }
// the screen texture (cards / list)
const SW = 800, SH = 1600; const SC = canvasTex(SW, SH);
const screen = new THREE.Mesh(new THREE.PlaneGeometry(PWD - 0.06, PHT - 0.06), new THREE.MeshBasicMaterial({ map: SC.tex, transparent: true, toneMapped: false, depthWrite: false })); screen.position.z = 0.046; phone.add(screen);

// ---------- beats ----------
installTimeline((wt, L) => ({
  doesnt: wt(0, "doesn"),
  l2: L[1].start, leave: wt(1, 'leave'), frozen: wt(1, 'frozen'), they: wt(1, 'They'), almost: wt(1, 'almost'), no: wt(1, 'no'), power: wt(1, 'power'),
  l3: L[2].start, swipe: wt(2, 'Swipe'), away: wt(2, 'away'), reloads: wt(2, 'reloads'), scratch: wt(2, 'scratch'), more: wt(2, 'More'), work: wt(2, 'work'),
  l4: L[3].start, real: wt(3, 'real'), drain: wt(3, 'drain'), still: wt(3, 'still'), running: wt(3, 'running'), nav: wt(3, 'navigation'),
  l5: L[4].start, settings: wt(4, 'Settings'), battery: wt(4, 'Battery'),
  l6: L[5].start, save: wt(5, 'save'), makes: wt(5, 'makes'), start: wt(5, 'start'), over: wt(5, 'over'),
  slam: L[0].end + 0.06,
}), () => { build(); });
window.shotTimes = () => { const c = [0, B.slam, B.l3, B.l4, B.l5, B.l6, B.sig, B.end]; return c.slice(0, -1).map((x, i) => ['s' + i, x, c[i + 1]]); };

let CK = [];
function build() {
  const F0 = [PX - 0.12, 1.3, 0], FP = [PX - 0.2, 1.42, 3.5], LK = [PX, 1.02, 0];
  CK = [
    [-0.2, [PX - 0.1, 1.4, 3.3], F0],
    [B.slam - 0.05, [PX - 0.16, 1.42, 3.45], F0],
    [B.slam + 0.4, [PX + 0.05, 1.12, 3.2], LK, 'whip'],
    [B.power, [PX + 0.02, 1.1, 3.1], LK],
    [B.l3 + 0.35, [PX + 0.18, 1.12, 3.05], LK, 'whip'],
    [B.more - 0.2, [PX + 0.12, 1.12, 2.95], [PX, 1.05, 0]],
    [B.more + 0.15, [PX + 0.1, 1.14, 2.8], [PX, 1.08, 0], 'whip'],
    [B.l4 + 0.4, [PX - 0.1, 1.1, 3.15], LK, 'whip'],
    [B.nav + 0.3, [PX - 0.05, 1.08, 3.05], LK],
    [B.l5 + 0.4, [PX + 0.05, 1.1, 3.05], LK, 'whip'],
    [B.l6 - 0.1, [PX + 0.08, 1.1, 3.0], LK],
    [B.l6 + 0.4, FP, F0, 'whip'],
    [B.sig - 0.05, [PX - 0.15, 1.42, 3.3], F0],
    [B.sig + 0.5, [PX - 0.1, 1.25, 2.4], F0, 'whip'],
    [B.end + 1, [PX - 0.1, 1.25, 2.35], F0],
  ]; }

// ---------- power level: how hard the chip works (0 idle .. 1 flat-out), and stream colour ----------
function work(t) {
  let w = 0.75 * (1 - seg(t, B.leave, 0.5)) + 0.25 * Math.exp(-Math.max(0, t - 0.0) * 0.6) * 0; // frame 0: a flicked card → busy
  if (t > B.frozen - 0.1) w = lerp(w, 0.03, seg(t, B.frozen - 0.1, 0.4));
  if (t > B.reloads - 0.1 && t < B.l4 + 0.3) w = Math.max(w, 1.0 * seg(t, B.reloads - 0.1, 0.2) * (1 - seg(t, B.l4, 0.3)));
  if (t > B.drain - 0.1 && t < B.l6 + 0.2) w = Math.max(w, 0.55 * seg(t, B.drain - 0.1, 0.3) * (1 - seg(t, B.l6 - 0.1, 0.3)));
  if (t > B.l5 && t < B.l6 + 0.3) w = Math.max(w, 0.4 * seg(t, B.battery, 0.3) * (1 - seg(t, B.l6, 0.3)));
  if (t > B.start - 0.1 && t < B.sig) w = Math.max(w, 0.95 * seg(t, B.start - 0.1, 0.2));
  return clamp(w); }

// ---------- screen drawing ----------
const APPS = [{ n: 'MAPS', c: '#2fbf8f', ic: 'pin' }, { n: 'MUSIC', c: '#9B6BFF', ic: 'note' }, { n: 'CHAT', c: '#3EA8FF', ic: 'chat' }];
function icon(x, kind, cx, cy, r, col) { x.save(); x.fillStyle = col; x.strokeStyle = col; x.lineWidth = r * 0.22; x.lineCap = 'round';
  if (kind === 'pin') { x.beginPath(); x.arc(cx, cy - r * 0.25, r * 0.55, Math.PI, 0); x.lineTo(cx, cy + r * 0.9); x.closePath(); x.fill(); x.fillStyle = '#0b1030'; x.beginPath(); x.arc(cx, cy - r * 0.25, r * 0.22, 0, 7); x.fill(); }
  if (kind === 'note') { x.beginPath(); x.arc(cx - r * 0.3, cy + r * 0.5, r * 0.3, 0, 7); x.fill(); x.fillRect(cx - r * 0.06, cy - r * 0.8, r * 0.16, r * 1.3); x.beginPath(); x.moveTo(cx, cy - r * 0.8); x.lineTo(cx + r * 0.55, cy - r * 0.5); x.stroke(); }
  if (kind === 'chat') { x.beginPath(); x.roundRect(cx - r * 0.8, cy - r * 0.6, r * 1.6, r * 1.05, r * 0.3); x.fill(); x.beginPath(); x.moveTo(cx - r * 0.3, cy + r * 0.4); x.lineTo(cx - r * 0.55, cy + r * 0.85); x.lineTo(cx + r * 0.05, cy + r * 0.42); x.fill(); }
  x.restore(); }
// a card at (cx,cy) of size w,h. o: { ice 0..1, build 0..1 (tile reveal), hot 0..1, a }
function card(x, app, cx, cy, w, h, o = {}) { const a = o.a ?? 1; if (a <= 0) return; x.save(); x.globalAlpha = a; x.translate(cx, cy); if (o.rot) x.rotate(o.rot);
  const b = o.build ?? 1; const r = 34;
  x.save(); x.beginPath(); x.roundRect(-w / 2, -h / 2, w, h, r); x.clip();
  if (b < 1) { // rebuild tile by tile from scratch
    const n = 6, m = 9, tw = w / n, th = h / m; x.fillStyle = 'rgba(10,14,48,0.9)'; x.fillRect(-w / 2, -h / 2, w, h);
    for (let j = 0; j < m; j++) for (let i = 0; i < n; i++) { const k = (j * n + i) / (n * m); if (k > b) continue; const fresh = clamp((b - k) * 8); x.fillStyle = fresh < 1 ? `rgba(255,181,71,${0.9 - 0.5 * fresh})` : app.c + '55'; x.fillRect(-w / 2 + i * tw + 2, -h / 2 + j * th + 2, tw - 4, th - 4); }
  } else { const g = x.createLinearGradient(0, -h / 2, 0, h / 2); g.addColorStop(0, o.hot ? `rgba(255,59,92,${0.5 + 0.3 * o.hot})` : app.c + 'aa'); g.addColorStop(1, '#0b1030'); x.fillStyle = g; x.fillRect(-w / 2, -h / 2, w, h);
    icon(x, app.ic, 0, -h * 0.08, w * 0.24, '#ffffff');
    if (app.ic === 'pin' && o.hot) { x.strokeStyle = `rgba(255,59,92,${o.hot})`; x.lineWidth = 8; x.setLineDash([18, 14]); x.lineDashOffset = -(o.t || 0) * 80; x.beginPath(); x.moveTo(-w * 0.4, h * 0.38); x.bezierCurveTo(-w * 0.1, h * 0.1, w * 0.1, h * 0.45, w * 0.38, h * 0.2); x.stroke(); x.setLineDash([]); }
  }
  if (o.ice > 0) { x.fillStyle = `rgba(200,236,255,${0.42 * o.ice})`; x.fillRect(-w / 2, -h / 2, w, h); x.strokeStyle = `rgba(240,250,255,${0.85 * o.ice})`; x.lineWidth = 3; let s = 7 + app.n.length; const rr = () => (s = (s * 16807) % 2147483647) / 2147483647;
    for (let k = 0; k < 7; k++) { const px = (rr() - 0.5) * w, py = (rr() - 0.5) * h; for (let q = 0; q < 6; q++) { const an = q / 6 * 6.283 + rr() * 0.3, L0 = 26 + rr() * 26; x.beginPath(); x.moveTo(px, py); x.lineTo(px + Math.cos(an) * L0, py + Math.sin(an) * L0); x.stroke(); } } }
  x.restore();
  x.lineWidth = o.hot ? 10 : 5; x.strokeStyle = o.hot ? `rgba(255,59,92,${0.6 + 0.4 * Math.sin((o.t || 0) * 9)})` : o.ice > 0.5 ? '#cfeaff' : 'rgba(200,210,255,0.6)'; x.beginPath(); x.roundRect(-w / 2, -h / 2, w, h, r); x.stroke();
  x.font = '700 64px Poppins'; x.textAlign = 'center'; x.fillStyle = '#ffffff'; x.fillText(app.n, 0, -h / 2 - 26);
  x.restore(); }

function drawScreen(t) { const x = SC.tex.image.getContext('2d'); x.clearRect(0, 0, SW, SH);
  // x-ray labels for chip & battery (screen-space positions of the 3D parts)
  const chipY = SH / 2 - CHY / (PHT - 0.06) * SH, batY = SH / 2 - BTY / (PHT - 0.06) * SH;
  x.font = '700 64px Poppins'; x.textAlign = 'right'; x.fillStyle = 'rgba(255,214,150,0.95)'; x.fillText('CHIP', SW / 2 - 140, chipY + 22); x.textAlign = 'center'; x.fillStyle = 'rgba(180,220,255,0.95)'; x.fillText('BATTERY', SW / 2, batY - 150);
  const cy = SH / 2 + 30, cw = 230, ch = 400, gap = 255;
  const listA = clamp(seg(t, B.settings - 0.1, 0.12)) * (1 - seg(t, B.l6 + 0.15, 0.2));
  const cardsA = 1 - clamp(seg(t, B.settings - 0.16, 0.1)) * (1 - seg(t, B.l6 + 0.1, 0.2));
  if (cardsA > 0.01) {
    const ice = clamp(seg(t, B.frozen - 0.05, 0.4)) * (1 - seg(t, B.start - 0.15, 0.25));
    // middle card (MUSIC) is the one that gets swiped: frame 0 flick, L3 swipe + rebuild, L6 swipe + rebuild
    let midY = cy, midA = 1, build = 1, rot = 0;
    const flick = (t0) => { const u = seg(t, t0, 0.45); return { dy: -eio(u) * 1100, a: 1 - seg(t, t0 + 0.25, 0.2) }; };
    if (t < B.leave) { const f = flick(-0.05); const back = seg(t, 0.85, 0.01); if (!back) { midY += f.dy; midA = f.a; rot = -0.15 * seg(t, -0.05, 0.4); } else { build = clamp(seg(t, 0.85, 1.35)); } }
    if (t > B.swipe - 0.1 && t < B.l4) { const f = flick(B.swipe - 0.05); if (t < B.reloads - 0.12) { midY += f.dy; midA = f.a; rot = -0.15 * seg(t, B.swipe - 0.05, 0.4); } else build = clamp(seg(t, B.reloads - 0.12, B.more - B.reloads + 0.25)); }
    if (t > B.l6 + 0.2) { const f = flick(B.l6 + 0.25); if (t < B.makes) { midY += f.dy; midA = f.a; rot = -0.15 * seg(t, B.l6 + 0.25, 0.4); } else build = clamp(seg(t, B.makes, B.over - B.makes + 0.3)); }
    const midIce = (t > B.swipe - 0.1 && t < B.l4) || t > B.l6 + 0.2 ? 0 : ice;
    const hot = clamp(seg(t, B.drain - 0.1, 0.3)) * (1 - seg(t, B.l6 - 0.1, 0.3));
    x.save(); x.globalAlpha = cardsA;
    card(x, APPS[0], SW / 2 - gap, cy, cw, ch, { ice: ice * (1 - hot), hot, t });
    card(x, APPS[2], SW / 2 + gap, cy, cw, ch, { ice });
    card(x, APPS[1], SW / 2, midY, cw, ch, { ice: midIce, build, a: midA, rot });
    // finger swipe trail
    const sw = [[-0.05, 0.4], [B.swipe - 0.05, 0.4], [B.l6 + 0.25, 0.4]].find(([t0, d]) => t > t0 && t < t0 + d);
    if (sw) { const u = seg(t, sw[0], sw[1]); x.strokeStyle = 'rgba(255,255,255,0.8)'; x.lineWidth = 26; x.lineCap = 'round'; x.beginPath(); x.moveTo(SW / 2, cy + 120 - u * 60); x.lineTo(SW / 2, cy + 120 - u * 480); x.stroke(); x.fillStyle = '#fff'; x.beginPath(); x.arc(SW / 2, cy + 120 - u * 480, 30, 0, 7); x.fill(); }
    // FROZEN tags
    if (false) { x.globalAlpha = cardsA * ice; x.font = '700 52px Poppins'; x.fillStyle = '#cfeaff'; x.fillText('FROZEN', SW / 2, cy + ch / 2 + 70); }
    x.restore(); }
  if (listA > 0.01) { x.save(); x.globalAlpha = listA; const y0 = SH / 2 - 330;
    x.fillStyle = 'rgba(10,14,48,0.92)'; x.beginPath(); x.roundRect(40, y0 - 90, SW - 80, 760, 40); x.fill(); x.strokeStyle = 'rgba(62,230,255,0.7)'; x.lineWidth = 4; x.stroke();
    x.font = '700 50px Poppins'; x.textAlign = 'left'; x.fillStyle = '#cfd6ff'; x.fillText('Battery usage by app', 80, y0);
    const rows = [[APPS[0], 1.0, RD], [APPS[2], 0.42, '#7CC8FF'], [APPS[1], 0.25, '#7CC8FF']];
    rows.forEach(([app, v, col], i) => { const ry = y0 + 120 + i * 180; const g = clamp(seg(t, B.settings + 0.15 * i, 0.4));
      icon(x, app.ic, 125, ry + 10, 40, app.c); x.font = '700 58px Poppins'; x.fillStyle = '#ffffff'; x.fillText(app.n, 190, ry); x.fillStyle = 'rgba(255,255,255,0.12)'; x.fillRect(190, ry + 26, 500, 54);
      x.fillStyle = col; x.shadowColor = col; x.shadowBlur = i ? 0 : 24; x.fillRect(190, ry + 26, 500 * v * eo(g), 54); x.shadowBlur = 0; });
    x.restore(); }
  SC.tex.needsUpdate = true; }

// ---------- state ----------
function props(t) {
  const w = work(t); phone.rotation.y = -0.12 + 0.05 * Math.sin(t * 0.7); phone.position.y = PY + 0.012 * Math.sin(t * 1.3);
  const navRed = t > B.drain - 0.1 && t < B.l6 - 0.1;
  chipM.emissiveIntensity = 0.15 + 1.1 * w; chipGlow.material.opacity = 0.6 * w; chipGlow.scale.setScalar(0.5 + 0.5 * w);
  traceM.opacity = 0.18 + 0.6 * w; traceM.color.set(navRed ? RD : AM);
  FL.forEach((s, i) => { const ph = ((i / NF) + t * (0.35 + 1.1 * w)) % 1; s.position.copy(trace.getPoint(ph)); s.position.z = 0.03; s.material.opacity = w > 0.05 ? Math.min(1, w * 1.6) * (i % Math.max(1, Math.round(3 - 2 * w)) ? 0.3 : 1) : 0; s.material.color.set(navRed ? '#ff6b80' : '#ffffff'); s.scale.setScalar(0.05 + 0.06 * w); });
  { const h2 = navRed ? clamp(seg(t, B.drain - 0.1, 0.3)) : 0; t2M.opacity = 0.7 * h2; F2.forEach((s, i) => { const ph = (i / 16 + t * 0.9) % 1; s.position.copy(T2.getPoint(ph)); s.position.z = 0.05; s.material.opacity = h2; s.scale.setScalar(0.09); }); }
  guy.root.visible = t < B.l2 + 0.2 || t > B.l6 + 0.3;
  batFill.material.opacity = 0.35 + 0.25 * w; batFill.material.color.set(w > 0.6 ? AM : CY);
  drawScreen(t);
  const mood = t < B.slam ? 'surprised' : (t > B.reloads && t < B.l4) ? 'worried' : (t > B.l5) ? 'happy' : 'neutral';
  const pose = t < B.slam ? 'surprised' : (t > B.l5 && t < B.l6) ? 'point' : (t > B.l2 && t < B.l3) ? 'explain' : (t > B.l3 && t < B.l4) ? 'shrug' : t > B.over ? 'point' : 'idle';
  guy.update(t, { pose, mood, headTurn: 0 });
}

// ---------- type ----------
function drawType(t) {
  { const g = ui.createLinearGradient(0, 0, 0, 760); g.addColorStop(0, 'rgba(2,3,12,0.65)'); g.addColorStop(1, 'rgba(2,3,12,0)'); ui.fillStyle = g; ui.fillRect(0, 0, W, 760); }
  if (t < B.slam + 0.22) { const bl = seg(t, B.slam, 0.2); ui.save(); ui.translate(540, 450); const s0 = (1 + 0.02 * Math.sin(t * 5)) * (1 + bl * 0.5); ui.scale(s0, s0); ui.translate(-540, -450); ui.globalAlpha = 1 - bl;
    const o = { from: 1.0 }, kick = t > B.doesnt ? Math.exp(-(t - B.doesnt) * 8) : 0;
    line([['SWIPING', -1, CY], ['APPS', -1], ['CLOSED', -1]], 280, 125, 5, o);
    line([['SAVES', -1], ['BATTERY?', -1, AM]], 430, 140, 5, o);
    ui.save(); ui.translate(540, 610); ui.scale(1 + 0.15 * kick, 1 + 0.15 * kick); ui.translate(-540, -610); line([['IT', -1], ["DOESN'T.", -1, RD]], 610, 170, 5, o); ui.restore(); ui.restore(); }
  superAt(t, 'FROZEN', B.frozen - 0.05, B.they - B.frozen + 0.1, 300, 190, '#cfeaff');
  if (t > B.almost - 0.05 && t < B.l3 + 0.05) { const o = { a: clamp((B.l3 + 0.05 - t) / 0.14) }; line([['ALMOST', B.almost - 0.05, '#ffffff']], 260, 110, t, o); line([['NO POWER', B.no - 0.05, CY]], 400, 150, t, o); }
  superAt(t, 'SWIPE', B.swipe - 0.05, B.reloads - B.swipe, 300, 180, '#ffffff');
