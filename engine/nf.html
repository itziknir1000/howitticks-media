const RED = '#E50914', REDc = new THREE.Color(RED), CY = '#3EE6FF', PU = '#9B6BFF';
bloom.threshold = 0.82; bloom.strength = 0.6; bloom.radius = 0.55;

key.intensity = 0.45; key.castShadow = false; rimP.intensity = 6; rimC.intensity = 4;
const easeB = t => { const c = 1.6; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); }; // back-out

// ---------- timeline (one cue sheet; every beat comes from measured word onsets) ----------
let B = {}, LINES = [];

    nothing: wordT(3, 'Do'), next: wordT(3, 'next'), plays: wordT(3, 'plays'), stopping: wordT(4, 'Stopping'), choice: wordT(4, 'choice'), watching: wordT(4, 'Watching'), deflt: wordT(4, 'default'),
    research: wordT(5, 'researchers'), autoplay: wordT(5, 'autoplay'), off: wordT(5, 'off'), sessions: wordT(5, 'sessions'), eighteen: wordT(5, 'eighteen'), shorter: wordT(5, 'shorter'),

  };

};

const floor = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.MeshStandardMaterial({ color: '#0a0f2e', roughness: 0.9 })); floor.rotation.x = -Math.PI / 2; scene.add(floor);
{ const pts = []; for (let x = -8; x <= 8; x += 0.25) for (let z = -8; z <= 6; z += 0.25) pts.push(x, 0.002, z);

  scene.add(new THREE.Points(g, new THREE.PointsMaterial({ color: '#2b3a9a', size: 0.018, transparent: true, opacity: 0.8 }))); }

const gP = glowSprite('rgba(155,107,255,1)', 9, 0.32); gP.position.set(-3.2, 2.6, -4.5); scene.add(gP);

const T = toon;

// sofa + YOU
const sofa = new THREE.Group(); { const m = T('#3b3f7a'); const base = new THREE.Mesh(new RoundedBoxGeometry(1.7, 0.35, 0.75, 4, 0.08), m); base.position.y = 0.3; sofa.add(base);

const SOFA = [-0.55, 0, 1.35]; sofa.position.set(...SOFA); scene.add(sofa);

const tag = (() => { const t = canvasTex(256, 128); t.draw((x, w, h) => { x.fillStyle = '#c9a36b'; x.beginPath(); x.roundRect(8, 8, w - 16, h - 16, 18); x.fill(); x.strokeStyle = '#7a5a2e'; x.lineWidth = 6; x.stroke(); x.fillStyle = '#3a2810'; x.beginPath(); x.arc(40, h / 2, 10, 0, 7); x.fill(); txt(x, 'YOU', w / 2 + 14, h / 2 + 4, 70, '#2a1c08', { dir: 'ltr', font: 'Poppins' }); });

// buttons STOP / KEEP WATCHING
function button(lines, w = 0.8, h = 0.46) { const t = canvasTex(1024, Math.round(1024 * h / w)); const face = new THREE.MeshBasicMaterial({ map: t.tex, toneMapped: false, color: new THREE.Color(0.62, 0.62, 0.62) });

    txt(x, lines[0], W2 / 2, H2 * 0.42, 150, '#ffffff', { dir: 'ltr', font: 'Poppins', maxW: W2 - 80 }); txt(x, lines[1], W2 / 2, H2 * 0.76, 62, 'rgba(255,255,255,0.75)', { dir: 'ltr', font: 'Poppins', w: 500 }); });

const bStop = button(['STOP', 'takes a tap']), bWatch = button(['WATCH', 'happens by itself']); let litLast = -1;

// session columns (illustrative heights)
function column(col, emiss) { const m = new THREE.Mesh(new RoundedBoxGeometry(0.5, 1, 0.5, 2, 0.02), new THREE.MeshStandardMaterial({ color: col, emissive: emiss || '#000', emissiveIntensity: emiss ? 0.35 : 0, roughness: 0.7, metalness: 0 })); scene.add(m); return m; }
const colOn = column(RED, RED), colOff = column('#7d84b8');
function colLabel(s1, s2) { const t = canvasTex(512, 256); t.draw((x, w, h) => { txt(x, s1, w / 2, 90, 92, '#fff', { dir: 'ltr', font: 'Poppins' }); txt(x, s2, w / 2, 190, 64, 'rgba(255,255,255,0.7)', { dir: 'ltr', font: 'Poppins', w: 500 }); });
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: t.tex, transparent: true, toneMapped: false, depthTest: false })); s.scale.set(0.9, 0.45, 1); scene.add(s); return s; }
const labOn = colLabel('ON', ''), labOff = colLabel('OFF', '');

const COLX = 0.42, COLZ = -0.5, HON = 1.75, HOFF = 1.17;

// ---------- screen content ----------
function drawEpisode(x, w, h, t, alt) {

  x.fillStyle = alt ? '#ff9b5a' : '#ffd27a'; x.globalAlpha = 0.9; x.beginPath(); x.arc(alt ? 380 : 900, 250, 90, 0, 7); x.fill(); x.globalAlpha = 1;
  for (let i = 0; i < 14; i++) { const bw = 70 + (i * 37) % 60, bh = 140 + (i * 53) % 220, bx = ((i * 97 - t * 18) % 1500 + 1500) % 1500 - 110; x.fillStyle = alt ? '#1c1033' : '#081a3c'; x.fillRect(bx, h - 120 - bh, bw, bh + 120);
    x.fillStyle = 'rgba(255,214,120,0.55)'; for (let k = 0; k < 6; k++) if ((i + k) % 3) x.fillRect(bx + 12 + (k % 2) * 28, h - 100 - bh + 20 + Math.floor(k / 2) * 40, 14, 18); }

}
const BAR = { u0: 60, u1: 1220, v: 676 };

function drawPostPlay(x, w, h, t, k, ringOnScreen) {

  const a = clamp(k * 1.4); x.globalAlpha = a; const tg = x.createLinearGradient(700, 150, 1200, 430); tg.addColorStop(0, '#2b1a4a'); tg.addColorStop(1, '#0c0716'); x.fillStyle = tg; x.beginPath(); x.roundRect(700, 150, 500, 281, 16); x.fill();
  x.fillStyle = '#ff9b5a'; x.beginPath(); x.arc(830, 260, 46, 0, 7); x.fill(); txt(x, 'Next Episode', 950, 480, 44, '#fff', { dir: 'ltr', font: 'Poppins' }); txt(x, 'Episode 4', 950, 530, 32, 'rgba(255,255,255,0.6)', { dir: 'ltr', font: 'Poppins', w: 500 }); x.globalAlpha = 1;

  const sc = bw / w; for (let i = 0; i < 26; i++) { const yy = by + (120 + i * 70 - (t * 60) % 70 - Math.floor(t * 60 / 70) * 0) * sc - ((t * 55) % (70)) * sc; txt(x, ['DIRECTED BY', 'A. MORROW', 'WRITTEN BY', 'J. KALE', 'MUSIC', 'R. OYELARAN', 'PRODUCER', 'L. VANCE'][i % 8], bx + bw / 2, yy, (i % 2 ? 40 : 26) * sc, i % 2 ? '#fff' : '#9aa0c0', { dir: 'ltr', font: 'Poppins', w: i % 2 ? 700 : 500 }); }
  x.restore();

}
let screenBright = 1;
function drawScreen(t) {
  scr.draw((x, w, h) => {
    if (t < B.credits) { drawEpisode(x, w, h, t, false); drawBar(x, 0.9 + 0.035 * clamp(t / B.credits)); }
    else if (t < B.plays) { drawPostPlay(x, w, h, t, eio(seg(t, B.shrink, 0.5)), 0); }
    else if (t < B.l7) { drawEpisode(x, w, h, t, true); drawBar(x, 0.004 + 0.02 * clamp((t - B.plays) / 6), clamp(1 - seg(t, B.research, 0.6))); }

// ---------- camera: Catmull-Rom through keys, timed; whip segments eased ----------
let CK = [];
function buildCam() {
  const ring1 = [0.62, 1.58, -0.95];
  CK = [
    [-0.2, [0.4, 3.4, 7.6], [0, 1.0, -1.0]],
    [1.3, [-0.2, 2.4, 5.0], [-0.1, 1.05, -1.2]],
    [B.slam - 0.05, [-0.35, 2.0, 3.9], [0, 1.15, -1.6]],
    [B.slam + 0.42, [0.25, 1.4, 2.25], [0.25, 1.62, -1.6], 'whip'],
    [B.shrink, [0.15, 1.38, 2.0], [0.2, 1.62, -1.6]],
    [B.timer + 0.5, [0.45, 1.5, 1.35], [0.55, 1.72, -1.2]],
    [B.nothing + 0.55, [-0.45, 2.3, 4.7], [0.05, 1.1, -1.0], 'whip'],
    [B.plays + 0.1, [-0.3, 2.1, 4.2], [0.1, 1.15, -1.1]],
    [B.stopping + 0.45, [1.0, 2.35, 4.3], [0.1, 1.0, -0.1], 'whip'],
    [B.deflt + 0.3, [0.75, 2.1, 3.9], [0.1, 1.05, -0.1]],
    [B.research + 0.55, [0.75, 2.4, 4.1], [0.05, 1.0, -0.5], 'whip'],
    [B.shorter + 0.4, [0.55, 2.25, 3.8], [0.05, 1.0, -0.5]],
    [B.l7 + 0.6, [2.6, 3.6, 7.6], [-0.2, 1.15, -0.9], 'whip'],
    [B.sig - 0.1, [1.6, 2.6, 5.2], [-0.1, 1.3, -1.2]],
    [B.sig + 0.55, [0.02, 1.46, -0.55], [0.0, 1.45, -1.6], 'whip'],
    [B.end + 1, [0.0, 1.45, -0.6], [0.0, 1.45, -1.6]],
  ];
}
function camAt(t) {
  let i = 0; while (i < CK.length - 2 && t >= CK[i + 1][0]) i++;
  const a = CK[i], b = CK[i + 1]; let u = clamp((t - a[0]) / (b[0] - a[0]));
  if (b[3] === 'whip') u = eio(u);
  const P = (k, j) => v3(CK[clamp(j, 0, CK.length - 1)][k]);
  const cr = (k) => { const p0 = P(k, i - 1), p1 = P(k, i), p2 = P(k, i + 1), p3 = P(k, i + 2); const u2 = u * u, u3 = u2 * u;
    if (b[3] === 'whip') return p1.clone().lerp(p2, u);
    return new THREE.Vector3().addScaledVector(p1, 2).addScaledVector(p2.clone().sub(p0), u).addScaledVector(p0.clone().multiplyScalar(2).sub(p1.clone().multiplyScalar(5)).add(p2.clone().multiplyScalar(4)).sub(p3), u2).addScaledVector(p1.clone().multiplyScalar(3).sub(p0).sub(p2.clone().multiplyScalar(3)).add(p3), u3).multiplyScalar(0.5); };
  const p = cr(1), l = cr(2);
  const dr = 1 - 0.85 * clamp((t - B.sig) / 0.4); p.x += Math.sin(t * 0.9) * 0.05 * dr; p.y += Math.sin(t * 1.3 + 1) * 0.03 * dr;
  // impact shake on the slam
  const sh = Math.exp(-Math.max(0, t - B.slam) * 9) * (t > B.slam ? 1 : 0) * 0.035; p.x += Math.sin(t * 90) * sh; p.y += Math.cos(t * 77) * sh;
  cam.position.copy(p); cam.lookAt(l);
  const fovKick = t > B.slam ? Math.exp(-(t - B.slam) * 6) * 6 : 0; cam.fov = 45 + fovKick; cam.updateProjectionMatrix();
}

// ---------- dot / ring / triangle choreography ----------
const RING1 = v3([0.62, 1.58, -0.95]), RING2 = v3([0, 1.5, -1.0]);
function arcPath(a, b, u, lift = 0.35) { const p = a.clone().lerp(b, u); p.y += Math.sin(Math.PI * u) * lift; return p; }
function hero(t) {
  dot.visible = dotGlow.visible = true; ring.visible = ringTrack.visible = num.visible = tri.visible = false;
  let p, r = 0.035, ringR = 0;
  const barEnd = S2W(BAR.u0 + (BAR.u1 - BAR.u0) * (0.9 + 0.035 * clamp(t / Math.max(1, B.credits))), BAR.v);
  const barStart = S2W(BAR.u0 + (BAR.u1 - BAR.u0) * (0.004 + 0.02 * clamp((t - B.plays) / 6)), BAR.v);
  const wOn = bWatch.position.clone().add(v3([0, 0, 0.1])); const colTop = v3([-COLX, 0.02, COLZ]);
  if (t < B.timer) { p = barEnd; r = 0.032 + (t > B.ep ? 0.03 * Math.exp(-(t - B.ep) * 4) : 0) + (t > B.credits ? 0.012 * seg(t, B.credits, 0.3) : 0); if (t > B.credits) p = barEnd.clone().add(v3([0, 0, 0.12 * seg(t, B.credits, 0.4)])); }
  else if (t < B.plays) {
    const u = eio(seg(t, B.timer, 0.45)); p = arcPath(barEnd.clone().add(v3([0, 0, 0.12])), RING1, u, 0.3); r = lerp(0.044, 0.07, u);
    const open = eo(seg(t, B.timer + 0.4, 0.35));
    if (open > 0) { ring.visible = ringTrack.visible = true; ringR = 0.3 * open; ring.position.copy(RING1); ringTrack.position.copy(RING1); ring.scale.setScalar(ringR); ringTrack.scale.setScalar(ringR);
      const runT0 = B.timer + 0.8, frac = clamp((t - runT0) / (B.plays - runT0)); setArc(1 - frac); ring.rotation.set(0, 0, Math.PI / 2);
      p = RING1.clone().add(v3([Math.cos(Math.PI / 2 + (1 - frac) * Math.PI * 2) * ringR, Math.sin(Math.PI / 2 + (1 - frac) * Math.PI * 2) * ringR, 0])); r = 0.045;
      num.visible = true; num.position.copy(RING1); num.scale.setScalar(0.34 * open); setNum(String(Math.max(1, 3 - Math.floor(frac * 3)))); }
  }
