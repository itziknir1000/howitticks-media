<!doctype html><html><head><meta charset="utf-8">
<style>@font-face{font-family:Poppins;src:url(assets/Poppins-Bold.ttf);font-weight:700}@font-face{font-family:Poppins;src:url(assets/Poppins-Medium.ttf);font-weight:500}html,body{margin:0;background:#000;overflow:hidden}canvas{position:absolute;left:0;top:0}</style>

</head><body><canvas id="ui" width="1080" height="1920" style="z-index:2"></canvas>
<script>window.LANG_EN = true;</script>
<script type="module">
// Spit, don't rinse. One visual thread: the cyan fluoride film on an x-ray cut-away molar
// (washed down the drain at frame 0 → rewinds back on → acid pulls minerals out → fluoride puts them back → water rinses it off → it stays: spit, don't rinse).
import { makeToon } from './toon.js';
import { THREE, W, H, clamp, lerp, eio, eo, seg, scene, cam, composer, bloom, key, ui, canvasTex, note } from './common.js';
import { B, installTimeline, stage, glowSprite, camAt, line, superAt, foot, signature, sigEvents, filmLook, eventsHelper, CY, RD, AM, PU } from './hit.js';

bloom.threshold = 0.8; bloom.strength = 0.6; bloom.radius = 0.55; key.intensity = 0.55; key.castShadow = false;
stage();
const BX = 0.3, TY = 1.02, S = 0.5; // tooth group origin (cervical line) and scale
const SKY = '#7CC8FF';

// ---------- the guy ----------
const guy = makeToon({ skin: '#f2c29b', hair: '#2b1d16', shirt: '#3a6df0', pants: '#1f2547', shoes: '#c94a3a', hairStyle: 'cap' });
guy.root.position.set(-0.22, 0, 0.75); guy.root.rotation.y = 0.55; guy.root.scale.setScalar(0.7); scene.add(guy.root);

// ---------- counter + x-ray sink ----------
const counter = new THREE.Mesh(new THREE.BoxGeometry(2.3, 0.6, 1.3), new THREE.MeshStandardMaterial({ color: '#0d1340', roughness: 0.8, emissive: '#05081f', emissiveIntensity: 0.6 })); counter.position.set(BX, 0.3, -0.1); scene.add(counter);
const basin = new THREE.Mesh(new THREE.TorusGeometry(0.5, 0.025, 10, 64), new THREE.MeshBasicMaterial({ color: CY, transparent: true, opacity: 0.7, toneMapped: false })); basin.rotation.x = -Math.PI / 2; basin.scale.set(1.2, 0.75, 1); basin.position.set(BX, 0.61, 0.15); scene.add(basin);
const bowlIn = new THREE.Mesh(new THREE.CircleGeometry(0.5, 64), new THREE.MeshBasicMaterial({ color: '#0a1150', transparent: true, opacity: 0.9 })); bowlIn.rotation.x = -Math.PI / 2; bowlIn.scale.set(1.2, 0.75, 1); bowlIn.position.set(BX, 0.605, 0.15); scene.add(bowlIn);
const DRAIN = new THREE.Vector3(BX, 0.62, 0.15);
const drain = new THREE.Mesh(new THREE.RingGeometry(0.035, 0.07, 32), new THREE.MeshBasicMaterial({ color: '#c8ceff', toneMapped: false, side: THREE.DoubleSide })); drain.rotation.x = -Math.PI / 2; drain.position.copy(DRAIN).add(new THREE.Vector3(0, 0.003, 0)); scene.add(drain);
const drainG = glowSprite('rgba(62,230,255,1)', 0.35, 0); drainG.position.copy(DRAIN); scene.add(drainG);
const tap = new THREE.Group(); { const m = new THREE.MeshStandardMaterial({ color: '#b8c4ff', metalness: 0.8, roughness: 0.25, emissive: '#2a3a90', emissiveIntensity: 0.5 });
  const a = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.035, 0.38, 14), m); a.position.y = 0.19; tap.add(a); const b = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 0.3, 14), m); b.rotation.z = Math.PI / 2; b.position.set(0.14, 0.38, 0); tap.add(b); }
tap.position.set(BX - 0.85, 0.6, -0.35); scene.add(tap);

// ---------- the tooth: outline in local units (x right, y up; y=0 = gum line) ----------
const crownY = s => 0.40 + 0.16 * Math.pow(Math.sin(Math.PI * s), 0.5) - 0.06 * Math.cos(4 * Math.PI * s);
const CROWN = []; // gum-left → up the side → over the cusps → down to gum-right
for (let i = 0; i <= 10; i++) { const u = i / 10; CROWN.push([lerp(-0.42, -0.47, Math.sin(u * Math.PI / 2)), lerp(0, crownY(0), u)]); }
for (let i = 1; i <= 60; i++) { const s = i / 60; CROWN.push([lerp(-0.47, 0.47, s), crownY(s)]); }
for (let i = 1; i <= 10; i++) { const u = i / 10; CROWN.push([lerp(0.47, 0.42, 1 - Math.cos(u * Math.PI / 2)), lerp(crownY(1), 0, u)]); }
const ROOT = []; // gum-right → right root → furcation → left root → gum-left
const bez = (p0, p1, p2, n, out) => { for (let i = 1; i <= n; i++) { const u = i / n, a = (1 - u) * (1 - u), b = 2 * u * (1 - u), c = u * u; out.push([a * p0[0] + b * p1[0] + c * p2[0], a * p0[1] + b * p1[1] + c * p2[1]]); } };
bez([0.42, 0], [0.42, -0.5], [0.3, -0.8], 14, ROOT); bez([0.3, -0.8], [0.16, -0.75], [0.12, -0.3], 10, ROOT); bez([0.12, -0.3], [0, -0.1], [-0.12, -0.3], 8, ROOT);
bez([-0.12, -0.3], [-0.16, -0.75], [-0.3, -0.8], 10, ROOT); bez([-0.3, -0.8], [-0.42, -0.5], [-0.42, 0], 14, ROOT);
const OUT = CROWN.concat(ROOT);
const X0 = -0.5, X1 = 0.5, Y0 = -0.84, Y1 = 0.66, TW = 512, TH = Math.round(512 * (Y1 - Y0) / (X1 - X0));
const cx = x => (x - X0) / (X1 - X0) * TW, cyy = y => (Y1 - y) / (Y1 - Y0) * TH, PXU = TW / (X1 - X0);
const tooth = new THREE.Group(); tooth.position.set(BX, TY, 0); tooth.scale.setScalar(S); scene.add(tooth);
const shape = new THREE.Shape(); OUT.forEach((p, i) => i ? shape.lineTo(p[0], p[1]) : shape.moveTo(p[0], p[1])); shape.closePath();
const fg = new THREE.ShapeGeometry(shape, 1); { const p = fg.attributes.position.array, uv = fg.attributes.uv.array; for (let i = 0; i < p.length / 3; i++) { uv[i * 2] = (p[i * 3] - X0) / (X1 - X0); uv[i * 2 + 1] = (p[i * 3 + 1] - Y0) / (Y1 - Y0); } }
const faceT = canvasTex(TW, TH); const face = new THREE.Mesh(fg, new THREE.MeshBasicMaterial({ map: faceT.tex, toneMapped: false, side: THREE.DoubleSide })); face.position.z = 0.004; tooth.add(face);
const body = new THREE.Mesh(new THREE.ExtrudeGeometry(shape, { depth: 0.45, bevelEnabled: true, bevelThickness: 0.05, bevelSize: 0.03, bevelSegments: 3, curveSegments: 4 }),
  new THREE.MeshPhysicalMaterial({ color: '#8fa6ff', transparent: true, opacity: 0.3, roughness: 0.25, metalness: 0.05, depthWrite: false, emissive: '#1a2a80', emissiveIntensity: 0.5 })); body.position.z = -0.47; tooth.add(body);
const rim = new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(OUT.map(p => new THREE.Vector3(p[0], p[1], 0.008))), new THREE.LineBasicMaterial({ color: CY, transparent: true, opacity: 0.8, toneMapped: false })); tooth.add(rim);
const gum = new THREE.Mesh(new THREE.PlaneGeometry(1.3, 0.04), new THREE.MeshBasicMaterial({ color: '#ff7a9a', transparent: true, opacity: 0.0, toneMapped: false })); gum.position.set(0, 0, 0.01); tooth.add(gum);

// crown path with outward normals (for the film, the minerals and the pits)
const CP = CROWN.map((p, i) => { const a = CROWN[Math.max(0, i - 1)], b = CROWN[Math.min(CROWN.length - 1, i + 1)]; const dx = b[0] - a[0], dy = b[1] - a[1], l = Math.hypot(dx, dy) || 1; return { x: p[0], y: p[1], nx: -dy / l, ny: dx / l }; });
// keep normals pointing outward (away from the crown centre at (0, 0.25))
CP.forEach(p => { if (p.nx * (p.x - 0) + p.ny * (p.y - 0.25) < 0) { p.nx *= -1; p.ny *= -1; } });
const EN = 0.075; // enamel thickness

// ---------- minerals (amber) and pits ----------
const MIN = []; { let s = 11; const r = () => (s = (s * 16807) % 2147483647) / 2147483647; for (let k = 0; k < 18; k++) { const i = 12 + Math.floor(r() * (CP.length - 24)); const p = CP[i]; const d = 0.022 + r() * 0.03;
  const m = new THREE.Mesh(new THREE.OctahedronGeometry(0.032, 0), new THREE.MeshBasicMaterial({ color: AM, transparent: true, toneMapped: false })); const g = glowSprite('rgba(255,181,71,1)', 0.14, 0.4); m.add(g);
  m.userData = { hx: p.x - p.nx * d, hy: p.y - p.ny * d, nx: p.nx, ny: p.ny, w: r() * 6, dl: r() * 0.35, out: 0.22 + r() * 0.2 }; tooth.add(m); MIN.push(m); } }
// ---------- bacteria (purple capsules) + acid drops ----------
const BAC = []; for (let k = 0; k < 5; k++) { const g = new THREE.Group(); const m = new THREE.Mesh(new THREE.CapsuleGeometry(0.035, 0.07, 6, 12), new THREE.MeshStandardMaterial({ color: PU, emissive: PU, emissiveIntensity: 0.8, roughness: 0.4 })); m.rotation.z = Math.PI / 2; g.add(m);
  for (const sx of [-1, 1]) { const e = new THREE.Mesh(new THREE.SphereGeometry(0.012, 8, 6), new THREE.MeshBasicMaterial({ color: '#ffffff' })); e.position.set(sx * 0.02, 0.012, 0.034); g.add(e); }
  const p = CP[14 + k * 12]; g.userData = { x: p.x + p.nx * 0.13, y: p.y + p.ny * 0.13, w: k * 1.3 }; g.position.z = 0.06; tooth.add(g); BAC.push(g); }
const ACID = []; for (let k = 0; k < 14; k++) { const s = glowSprite('rgba(255,59,92,1)', 0.09, 0); s.userData = { b: k % 5, ph: k * 0.37 }; s.position.z = 0.07; tooth.add(s); ACID.push(s); }

// ---------- fluoride film particles (cyan) ----------
const FL = []; for (let k = 0; k < 44; k++) { const i = Math.round(2 + k / 43 * (CP.length - 5)); const p = CP[i]; const s = glowSprite('rgba(62,230,255,1)', 0.075, 0.9); s.userData = { i, sx: (p.x + 0.5), j: (k * 0.618) % 1 }; scene.add(s); FL.push(s); }
const _w = new THREE.Vector3();
function homeW(p, off) { _w.set(p.x + p.nx * off, p.y + p.ny * off, 0.03); return tooth.localToWorld(_w.clone()); }
// fraction washed (0 = on the tooth, 1 = in the drain)
function washed(t) {
  if (t < B.l2) return seg(t, -0.75, 1.9);
  if (t < B.rinses - 0.15) return seg(B.l2 - 0.01, -0.75, 1.9) * (1 - eio(seg(t, B.l2 - 0.05, 0.6)));
  if (t < B.l6) return seg(t, B.rinses - 0.15, 1.15);
  return 1 - eio(seg(t, B.l6 - 0.05, 0.6)); }
const waveX = t => { const a = t < B.l2 ? seg(t, -0.75, 1.9) : (t > B.rinses - 0.3 && t < B.l6) ? seg(t, B.rinses - 0.3, 1.15) : -1; return a; };

// ---------- mouthwash bottle (slides in on "Save mouthwash for later") ----------
const bottle = new THREE.Group(); { const m = new THREE.MeshPhysicalMaterial({ color: PU, transparent: true, opacity: 0.75, roughness: 0.15, emissive: '#3a1f9a', emissiveIntensity: 0.6 });
  const b = new THREE.Mesh(new THREE.CylinderGeometry(0.11, 0.11, 0.36, 24), m); b.position.y = 0.18; bottle.add(b); const n = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.08, 0.06, 20), m); n.position.y = 0.39; bottle.add(n);
  const c = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 0.07, 20), new THREE.MeshStandardMaterial({ color: '#e8ecff', emissive: '#8090ff', emissiveIntensity: 0.4 })); c.position.y = 0.455; bottle.add(c); }
bottle.position.set(BX + 0.45, 0.6, 0.4); scene.add(bottle);

// ---------- cut face texture ----------
function pathOf(x, pts) { x.beginPath(); pts.forEach((p, i) => i ? x.lineTo(cx(p[0]), cyy(p[1])) : x.moveTo(cx(p[0]), cyy(p[1]))); }
function drawFace(t) { const x = faceT.tex.image.getContext('2d'); x.clearRect(0, 0, TW, TH);
  x.save(); pathOf(x, OUT); x.closePath(); x.clip();
  // dentin
  const g = x.createLinearGradient(0, 0, 0, TH); g.addColorStop(0, '#d9c9a8'); g.addColorStop(1, '#a8906e'); x.fillStyle = g; x.fillRect(0, 0, TW, TH);
  // pulp + canals
  x.fillStyle = '#d0485e'; x.beginPath(); x.ellipse(cx(0), cyy(0.12), 0.17 * PXU, 0.15 * PXU, 0, 0, 7); x.fill();
  x.strokeStyle = '#d0485e'; x.lineWidth = 0.05 * PXU; x.lineCap = 'round'; for (const s of [-1, 1]) { x.beginPath(); x.moveTo(cx(s * 0.12), cyy(0.05)); x.quadraticCurveTo(cx(s * 0.25), cyy(-0.4), cx(s * 0.29), cyy(-0.76)); x.stroke(); }
  // enamel shell
  x.strokeStyle = '#eef3ff'; x.lineWidth = EN * 2 * PXU; x.lineJoin = 'round'; pathOf(x, CROWN); x.stroke();
  x.strokeStyle = 'rgba(160,180,230,0.6)'; x.lineWidth = 3; x.beginPath(); CP.forEach((p, i) => { const X = cx(p.x - p.nx * EN), Y = cyy(p.y - p.ny * EN); i ? x.lineTo(X, Y) : x.moveTo(X, Y); }); x.stroke();
  // pits where minerals left (acid), refilled with cyan glow (fluoride)
  const outA = eio(seg(t, B.pulls - 0.1, 0.7)), back = eio(seg(t, B.helps - 0.1, 0.9));
  MIN.forEach(m => { const d = m.userData, pit = outA * (1 - back); const glow = back * (1 - seg(t, B.l5, 0.5));
    if (pit > 0.01) { x.fillStyle = `rgba(40,30,60,${0.85 * pit})`; x.beginPath(); x.arc(cx(d.hx), cyy(d.hy), 0.03 * PXU, 0, 7); x.fill(); }
    if (glow > 0.01) { x.fillStyle = `rgba(62,230,255,${0.7 * glow})`; x.beginPath(); x.arc(cx(d.hx), cyy(d.hy), 0.032 * PXU, 0, 7); x.fill(); } });
  // the fluoride film along the enamel (fades where particles have been washed off)
  const wsh = washed(t); x.lineCap = 'round';
  for (let i = 1; i < CP.length; i++) { const sx = (CP[i].x + 0.5); const gone = clamp((wsh * 1.6 - sx * 0.6)); const a = 1 - gone; if (a < 0.02) continue;
    x.strokeStyle = `rgba(62,230,255,${0.95 * a})`; x.lineWidth = 0.035 * PXU; x.beginPath(); x.moveTo(cx(CP[i - 1].x), cyy(CP[i - 1].y)); x.lineTo(cx(CP[i].x), cyy(CP[i].y)); x.stroke(); }
  // L6: the leftover fluoride soaks into the enamel and keeps working (minerals lock back in)
  const soak = eio(seg(t, B.l6, 1.4)); if (soak > 0) { x.globalAlpha = 0.45 * soak * (0.85 + 0.15 * Math.sin(t * 6)); x.strokeStyle = '#3ee6ff'; x.lineWidth = EN * 2 * PXU; x.lineJoin = 'round'; pathOf(x, CROWN); x.stroke(); x.globalAlpha = 1;
    MIN.forEach((m, k) => { const d = m.userData; const a = clamp(soak * 1.6 - (k % 6) * 0.12); if (a <= 0) return; x.fillStyle = `rgba(255,181,71,${0.95 * a})`; x.beginPath(); x.arc(cx(d.hx), cyy(d.hy), 0.022 * PXU * (1 + 0.6 * (1 - a)), 0, 7); x.fill(); }); }
  x.restore(); faceT.tex.needsUpdate = true; }

// ---------- beats ----------
installTimeline((wt, L) => ({
  rinsing: wt(0, 'rinsing'), paste: wt(0, 'toothpaste'), down: wt(0, 'down'), sink: wt(0, 'sink'),
  l2: L[1].start, fluor: wt(1, 'fluoride'), stay: wt(1, 'stay'), teeth: wt(1, 'teeth'),
  l3: L[2].start, acid: wt(2, 'acid'), bact: wt(2, 'bacteria'), pulls: wt(2, 'pulls'), minerals: wt(2, 'minerals'), enamel: wt(2, 'enamel'),
  l4: L[3].start, helps: wt(3, 'helps'), put: wt(3, 'put'), back: wt(3, 'back'),
  l5: L[4].start, water: wt(4, 'water'), rinses: wt(4, 'rinses'), off: wt(4, 'off'), save: wt(4, 'save'), mouth: wt(4, 'mouthwash'), later: wt(4, 'later'),
  l6: L[5].start, works: wt(5, 'works'), after: wt(5, 'after'), stop: wt(5, 'stop'), spit: wt(5, 'spit'), dont: wt(5, "don"), rinse: wt(5, 'rinse'),
  slam: L[0].end + 0.06,
}), () => { buildCam(); });
window.shotTimes = () => { const c = [0, B.slam, B.l3, B.l4, B.l5, B.l6, B.sig, B.end]; return c.slice(0, -1).map((x, i) => ['s' + i, x, c[i + 1]]); };

let CK = [];
const TC = TY + 0.1; // look height around the crown
function buildCam() {
  CK = [
    [-0.2, [0.12, 1.5, 2.75], [0.2, 1.3, 0]],
    [B.sink, [0.14, 1.48, 2.6], [0.22, 1.29, 0]],
    [B.slam - 0.05, [0.16, 1.46, 2.5], [0.24, 1.28, 0]],
    [B.slam + 0.45, [BX, 1.22, 2.25], [BX, 1.08, 0], 'whip'],
    [B.l3 - 0.1, [BX + 0.04, 1.2, 2.1], [BX, 1.08, 0]],
    [B.l3 + 0.45, [BX + 0.05, 1.26, 1.9], [BX + 0.03, 1.12, 0], 'whip'],
    [B.l4 - 0.1, [BX + 0.02, 1.27, 1.8], [BX + 0.02, 1.12, 0]],
    [B.l4 + 0.4, [BX - 0.05, 1.26, 1.95], [BX, 1.11, 0], 'whip'],
    [B.save - 0.1, [BX - 0.03, 1.26, 1.9], [BX, 1.11, 0]],
    [B.save + 0.35, [BX + 0.3, 1.5, 2.6], [BX + 0.2, 1.02, 0], 'whip'],
    [B.l6 - 0.1, [BX + 0.26, 1.48, 2.5], [BX + 0.18, 1.02, 0]],
    [B.l6 + 0.4, [BX, 1.24, 2.2], [BX, 1.1, 0], 'whip'],
    [B.sig - 0.05, [BX, 1.2, 1.8], [BX, 1.1, 0]],
    [B.sig + 0.5, [BX, 1.15, 1.3], [BX, 1.1, 0], 'whip'],
    [B.end + 1, [BX, 1.15, 1.25], [BX, 1.1, 0]],
  ]; }

// ---------- state ----------
function props(t) {
  drawFace(t); tooth.updateMatrixWorld();
  // hook: the tooth drops in already spinning to face us
  const land = eo(seg(t, -0.15, 0.4)); tooth.position.y = TY + (1 - land) * 0.3; tooth.rotation.y = (1 - land) * 0.7 + 0.04 * Math.sin(t * 1.1);
  tooth.updateMatrixWorld();
  // fluoride particles: home on the enamel → swept right by the water → spiral down the drain
  const wsh = washed(t);
  FL.forEach(s => { const d = s.userData, p = CP[d.i]; const u = clamp(wsh * 1.6 - d.sx * 0.6); const h = homeW(p, 0.025);
    if (u <= 0) { s.position.copy(h); s.position.x += 0.004 * Math.sin(t * 6 + d.j * 9); s.material.opacity = 0.85; return; }
    const mid = new THREE.Vector3(h.x + 0.35 + 0.2 * d.j, lerp(h.y, DRAIN.y, 0.35), 0.2); const e = eio(u);
    const a = (1 - e) * (1 - e), b = 2 * e * (1 - e), c = e * e; const sp = (1 - e) * 0; const ang = e * 9 + d.j * 6, r = 0.12 * (1 - e) * e * 3;
    s.position.set(a * h.x + b * mid.x + c * DRAIN.x + Math.cos(ang) * r, a * h.y + b * mid.y + c * DRAIN.y, a * h.z + b * mid.z + c * DRAIN.z + Math.sin(ang) * r * 0.6);
    s.material.opacity = 0.9 * (1 - seg(u, 0.85, 0.15)); });
  drainG.material.opacity = 0.6 * Math.sin(Math.PI * clamp(wsh)) * (waveX(t) >= 0 ? 1 : 0.3);
  // minerals: sit in the enamel → pulled out by acid → put back by fluoride
  const outA = eio(seg(t, B.pulls - 0.1, 0.7)), back = eio(seg(t, B.helps - 0.1, 0.9)); const vis = clamp(seg(t, B.l3 - 0.1, 0.3)) * (1 - seg(t, B.l5 + 0.3, 0.3));
  MIN.forEach(m => { const d = m.userData; m.visible = vis > 0.01; if (!m.visible) return; const o = clamp(outA - d.dl * 0.5) * (1 - clamp(back * 1.3 - d.dl)); const r = d.out * eo(o);
    m.position.set(d.hx + d.nx * r + 0.01 * Math.sin(t * 3 + d.w) * o, d.hy + d.ny * r + 0.01 * Math.cos(t * 2.6 + d.w) * o, 0.04); m.rotation.set(t * 2 + d.w, t * 1.5, 0); m.material.opacity = vis; m.scale.setScalar(1 + 0.3 * o); });
  // bacteria + acid on L3
  const ba = eio(seg(t, B.l3 - 0.1, 0.35)) * (1 - seg(t, B.l4 + 0.1, 0.35));
  BAC.forEach(g => { const d = g.userData; g.visible = ba > 0.01; g.position.set(d.x + 0.015 * Math.sin(t * 2 + d.w), d.y + 0.02 * Math.cos(t * 2.4 + d.w), 0.06); g.scale.setScalar(0.3 + 0.7 * eo(ba)); g.rotation.z = 0.3 * Math.sin(t * 1.7 + d.w); });
  const aa = ba * clamp(seg(t, B.acid - 0.05, 0.2));
  ACID.forEach(s => { const d = s.userData, g = BAC[d.b].userData; const ph = (t * 1.3 + d.ph) % 1; const p = CP[14 + d.b * 12]; s.position.set(lerp(g.x, p.x, ph), lerp(g.y, p.y, ph), 0.07); s.material.opacity = 0.9 * aa * Math.sin(ph * Math.PI); s.scale.setScalar(0.07 + 0.03 * Math.sin(ph * Math.PI)); });
  // bottle on "Save mouthwash for later"
  const bo = eo(seg(t, B.save - 0.15, 0.35)) * (1 - seg(t, B.l6 + 0.2, 0.3)); bottle.visible = bo > 0.01; bottle.position.y = 0.6 + (1 - bo) * 0.5; bottle.rotation.y = t * 0.8; bottle.scale.setScalar(0.4 + 0.6 * bo);
  tap.rotation.y = 0; rim.material.opacity = 0.6 + 0.3 * Math.sin(t * 2);
  // the guy
  const mood = t < B.slam ? 'surprised' : t > B.spit - 0.1 ? 'happy' : (t > B.acid && t < B.l4) ? 'worried' : 'neutral';
  const pose = t < B.slam ? 'surprised' : t > B.works ? 'point' : (t > B.save && t < B.l6) ? 'shrug' : (t > B.l2 && t < B.l3) ? 'explain' : 'idle';
  guy.update(t, { pose, mood, headTurn: 0.35 });
}

// ---------- 2D overlay: the water wave sweeping across the crown ----------
const _v = new THREE.Vector3();
function proj(x, y, z = 0.05) { _v.set(x, y, z); tooth.localToWorld(_v); _v.project(cam); return [(_v.x + 1) / 2 * W, (1 - _v.y) / 2 * H]; }
function drawWater(t) { const u = waveX(t); if (u < 0 || u > 1.05) return; const env = Math.sin(Math.PI * clamp(u)); if (env < 0.02) return; tooth.updateMatrixWorld(); cam.updateMatrixWorld();
  const fx = lerp(-0.85, 0.95, u); ui.save(); ui.lineCap = 'round'; ui.globalCompositeOperation = 'lighter';
  for (let k = 0; k < 7; k++) { const pts = []; const y0 = 0.68 - k * 0.11; for (let i = 0; i <= 40; i++) { const x = lerp(fx - 0.75, fx, i / 40); const y = y0 + 0.03 * Math.sin(x * 14 - t * 12 + k) - 0.1 * (i / 40) * (k % 2); pts.push(proj(x, y, 0.06)); }
    const gr = ui.createLinearGradient(pts[0][0], pts[0][1], pts[40][0], pts[40][1]); gr.addColorStop(0, 'rgba(124,200,255,0)'); gr.addColorStop(1, `rgba(124,200,255,${0.7 * env})`);
    ui.strokeStyle = gr; ui.lineWidth = 16 - k; ui.shadowColor = SKY; ui.shadowBlur = 20; ui.beginPath(); pts.forEach((p, i) => i ? ui.lineTo(p[0], p[1]) : ui.moveTo(p[0], p[1])); ui.stroke(); }
  // droplets at the wave front
  for (let k = 0; k < 10; k++) { const ph = (t * 1.7 + k * 0.29) % 1; const [px, py] = proj(fx + 0.05 + ph * 0.25, 0.62 - k * 0.07 - ph * 0.3, 0.07); ui.globalAlpha = env * (1 - ph); ui.fillStyle = '#d8f0ff'; ui.beginPath(); ui.arc(px, py, 7, 0, 7); ui.fill(); }
  ui.restore(); }

// ---------- type ----------
function drawType(t) {
  { const g = ui.createLinearGradient(0, 0, 0, 820); g.addColorStop(0, 'rgba(2,3,12,0.6)'); g.addColorStop(1, 'rgba(2,3,12,0)'); ui.fillStyle = g; ui.fillRect(0, 0, W, 820); }
  // frame 0: the whole claim is on screen and breathing; blown away on the slam
  if (t < B.slam + 0.22) { const bl = seg(t, B.slam, 0.2); ui.save(); ui.translate(540, 480); const s0 = (1 + 0.02 * Math.sin(t * 5)) * (1 + bl * 0.5); ui.scale(s0, s0); ui.translate(-540, -480); ui.globalAlpha = 1 - bl;
    const o = { from: 1.0 }, kick = t > B.sink ? Math.exp(-(t - B.sink) * 8) : 0;
    line([["YOU'RE", -1], ['RINSING', -1]], 340, 120, 5, o);
    line([['YOUR', -1], ['TOOTHPASTE', -1, CY]], 490, 120, 5, o);
    line([['DOWN', -1], ['THE', -1]], 640, 115, 5, o);
    ui.save(); ui.translate(540, 790); ui.scale(1 + 0.12 * kick, 1 + 0.12 * kick); ui.translate(-540, -790); line([['SINK.', -1, RD]], 790, 190, 5, o); ui.restore(); ui.restore(); }
  superAt(t, 'FLUORIDE', B.fluor - 0.05, B.l3 - B.fluor + 0.05, 370, 170, CY);
  superAt(t, 'SHOULD STAY ON YOUR TEETH', B.stay - 0.05, B.l3 - B.stay + 0.05, 540, 80, '#ffffff');
  superAt(t, 'ACID', B.acid - 0.05, B.pulls - B.acid, 370, 230, RD);
  superAt(t, 'PULLS MINERALS OUT', B.pulls - 0.05, B.l4 - B.pulls + 0.05, 370, 105, AM);
  superAt(t, 'FLUORIDE', B.l4 - 0.05, B.l5 - B.l4 + 0.05, 370, 170, CY);
  superAt(t, 'HELPS PUT THEM BACK', B.helps - 0.05, B.l5 - B.helps + 0.05, 540, 95, '#ffffff');
  superAt(t, 'WATER', B.water - 0.05, B.rinses - B.water, 370, 220, SKY);
  superAt(t, 'RINSES IT OFF', B.rinses - 0.05, B.save - B.rinses, 370, 140, RD);
  superAt(t, 'MOUTHWASH', B.save - 0.05, B.l6 - B.save + 0.05, 370, 150, PU);
  superAt(t, 'LATER.', B.later - 0.05, B.l6 - B.later + 0.05, 540, 150, '#ffffff');
  superAt(t, 'KEEPS WORKING', B.l6 - 0.02, B.spit - B.l6 - 0.03, 370, 140, CY);
  superAt(t, 'AFTER YOU STOP', B.after - 0.05, B.spit - B.after, 530, 100, '#ffffff');
  if (t > B.spit - 0.05 && t < B.sig + 0.25) { const o = { a: clamp((B.sig + 0.25 - t) / 0.15) }; line([['SPIT.', B.spit - 0.05, CY]], 370, 200, t, o); line([["DON'T", B.dont - 0.05], ['RINSE.', B.rinse - 0.05, RD]], 570, 150, t, o); }
  const fa = (t > 0.4 && t < B.sig) ? clamp((t - 0.4) / 0.3) * (1 - seg(t, B.sig - 0.2, 0.2)) : 0; if (fa > 0) { ui.save(); ui.globalAlpha = 0.5 * fa; ui.fillStyle = '#02030c'; ui.beginPath(); ui.roundRect(90, 1468, 900, 54, 27); ui.fill(); ui.restore(); }
  foot('Simplified model · illustrative · Sources: NHS, CDC, UK DHSC', fa * 1.25, 1505);
}

// ---------- sound cue sheet (clean tonal only) ----------
window.getEvents = () => { const { ev, done } = eventsHelper();
  ev(0.05, 'swish', 0.9); ev(0.3, 'pop', 0.8); ev(B.paste, 'tick', 0.8); ev(B.sink, 'pop2', 1.0); ev(B.slam, 'slam', 1.2); ev(B.slam, 'whoosh', 1);
  ev(B.l2 - 0.05, 'swish', 0.8); ev(B.fluor - 0.05, 'super', 0.9); ev(B.stay - 0.05, 'ping', 0.6);
  ev(B.l3 + 0.1, 'whoosh'); ev(B.acid - 0.05, 'slam', 0.8); ev(B.pulls - 0.05, 'pop', 0.8); ev(B.minerals, 'click', 0.7);
  ev(B.l4 + 0.05, 'whoosh'); ev(B.l4 - 0.05, 'super', 0.8); ev(B.helps, 'pop2', 0.8); ev(B.back, 'ping', 0.7);
  ev(B.l5 + 0.05, 'whoosh'); ev(B.water - 0.05, 'pop', 0.8); ev(B.rinses - 0.1, 'swish', 1); ev(B.save - 0.05, 'card', 0.8); ev(B.later - 0.05, 'pop2', 0.7);
  ev(B.l6 + 0.1, 'whoosh', 0.9); ev(B.works - 0.1, 'super', 0.8); ev(B.spit - 0.05, 'slam', 0.9); ev(B.dont - 0.05, 'pop', 0.7); ev(B.rinse - 0.05, 'slam', 0.8); ev(B.rinse + 0.05, 'ping', 0.6);
  sigEvents(ev); return done(); };

window.renderAt = t => {
  camAt(t, CK, { shakes: [B.slam, B.acid, B.spit] }); props(t);
  bloom.strength = 0.6 + (t > B.slam ? 0.45 * Math.exp(-(t - B.slam) * 7) : 0);
  composer.render(); ui.clearRect(0, 0, W, H); drawWater(t); drawType(t); signature(t, '', RD); note('Illustrative model · sources: NHS, CDC, UK DHSC', clamp((t - B.sig - 0.38) / 0.18), 1440); filmLook(t); return 'f';
};
window.ready = Promise.resolve(true);
