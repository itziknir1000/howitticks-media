<!doctype html><html><head><meta charset="utf-8">
<style>@font-face{font-family:Poppins;src:url(assets/Poppins-Bold.ttf);font-weight:700}@font-face{font-family:Poppins;src:url(assets/Poppins-Medium.ttf);font-weight:500}html,body{margin:0;background:#000;overflow:hidden}canvas{position:absolute;left:0;top:0}</style>
<script type="importmap">{"imports":{"three":"./three/build/three.module.js","three/addons/":"./three/jsm/"}}</script>
</head><body><canvas id="ui" width="1080" height="1920" style="z-index:2"></canvas>
<script>window.LANG_EN = true;</script>
<script type="module">
// Why does 4.5 stars sell better than a perfect 5? One thread: the amber star row. It rates two products, becomes the axis of the chart, then the 5.0 row is doubted and the 4.5 row wins.
import { makeToon, toon } from './toon.js';
import { THREE, RoundedBoxGeometry, W, H, clamp, lerp, eio, eo, seg, scene, cam, composer, bloom, key, ui, canvasTex, txt } from './common.js';
import { B, v3, easeB, installTimeline, stage, glowSprite, camAt, line, superAt, hook, foot, signature, sigEvents, filmLook, eventsHelper, CY, PU, RD, AM } from './hit.js';

bloom.threshold = 0.8; bloom.strength = 0.6; bloom.radius = 0.55; key.intensity = 0.7; key.castShadow = false;
stage();
const T = toon;
const amberM = new THREE.MeshBasicMaterial({ color: new THREE.Color(AM).multiplyScalar(1.35), toneMapped: false });
const greyStar = T('#3a4170'); const dimAmber = T('#7a6440');
// ---------- stars ----------
function starGeo(rO, rI, half = false) { const s = new THREE.Shape(); const n = half ? 6 : 10;
  for (let k = 0; k < n; k++) { const a = Math.PI / 2 + k * Math.PI / 5, r = k % 2 ? rI : rO; const x = Math.cos(a) * r, y = Math.sin(a) * r; k ? s.lineTo(x, y) : s.moveTo(x, y); } s.closePath();
  const g = new THREE.ExtrudeGeometry(s, { depth: 0.035, bevelEnabled: true, bevelThickness: 0.012, bevelSize: 0.01, bevelSegments: 2 }); g.translate(0, 0, -0.02); return g; }
const SG = starGeo(0.09, 0.037), SH = starGeo(0.09, 0.037, true);
function starRow(rating, dim = false) { const g = new THREE.Group(); const stars = [];
  for (let i = 0; i < 5; i++) { const x = (i - 2) * 0.21; const base = new THREE.Mesh(SG, greyStar); base.position.x = x; g.add(base);
    const fillAmt = clamp(rating - i); let lit = null; const lm = dim ? dimAmber : amberM; if (fillAmt >= 1) lit = new THREE.Mesh(SG, lm); else if (fillAmt >= 0.5) lit = new THREE.Mesh(SH, lm);
    if (lit) { lit.position.set(x, 0, 0.012); g.add(lit); } stars.push({ base, lit }); }
  return { g, stars }; }
// ---------- two products on pedestals (x-ray boxes) ----------
const prodMat = new THREE.MeshPhysicalMaterial({ color: '#2a3a9a', transparent: true, opacity: 0.38, roughness: 0.25, emissive: '#0b1240', emissiveIntensity: 0.9, depthWrite: false });
const edgeM = () => new THREE.LineBasicMaterial({ color: CY, transparent: true, opacity: 0.8, toneMapped: false });
function product(x, rating, label) { const g = new THREE.Group(); g.position.set(x, 0, 0); scene.add(g);
  const ped = new THREE.Mesh(new RoundedBoxGeometry(0.95, 0.3, 0.7, 3, 0.04), T('#1c2360')); ped.position.y = 0.15; g.add(ped);
  const box = new THREE.Mesh(new RoundedBoxGeometry(0.72, 0.95, 0.5, 3, 0.05), prodMat.clone()); box.position.y = 0.3 + 0.475; g.add(box);
  const em = edgeM(); const e = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(0.72, 0.95, 0.5)), em); e.position.copy(box.position); g.add(e);
  // the gadget inside: same product in both boxes (headphones-ish ring + cups)
  const core = new THREE.Group(); core.position.y = 0.78; g.add(core);
  const band = new THREE.Mesh(new THREE.TorusGeometry(0.2, 0.025, 10, 40, Math.PI), T('#9b6bff')); band.position.y = 0.02; core.add(band);
  for (const s of [-1, 1]) { const cup = new THREE.Mesh(new THREE.CylinderGeometry(0.075, 0.075, 0.07, 24), T('#9b6bff')); cup.rotation.z = Math.PI / 2; cup.position.set(s * 0.2, -0.02, 0); core.add(cup); }
  const row = starRow(rating); row.g.position.set(0, 1.55, 0.05); g.add(row.g);
  const t = canvasTex(512, 160); t.draw((c, w, h) => txt(c, label, w / 2, h / 2 + 6, 104, '#ffffff', { dir: 'ltr', font: 'Poppins' }));
  const plate = new THREE.Mesh(new THREE.PlaneGeometry(0.75, 0.234), new THREE.MeshBasicMaterial({ map: t.tex, transparent: true, toneMapped: false })); plate.position.set(0, 0.15, 0.352); g.add(plate);
  return { g, box, em, core, row }; }
const PA = product(-0.58, 4.5, '4.5 ★'), PB = product(0.58, 5, '5.0 ★');
// the store: rows of dim product boxes behind, each with a tiny star row
const shelf = new THREE.Group(); scene.add(shelf); const dimM = T('#2a3170');
for (let r = 0; r < 3; r++) for (let c = -4; c <= 4; c++) { if (r === 0 && Math.abs(c) <= 1) continue; const b = new THREE.Mesh(new RoundedBoxGeometry(0.55, 0.7, 0.4, 2, 0.04), dimM); b.position.set(c * 0.85, 0.35, -2.3 - r * 1.2); shelf.add(b);
  const rr = starRow(3 + ((c * 7 + r * 3 + 20) % 5) * 0.5, true); rr.g.scale.setScalar(0.6); rr.g.position.set(c * 0.85, 0.92, -2.3 - r * 1.2); shelf.add(rr.g); }
const warm = new THREE.SpotLight('#ffcf8a', 0, 9, 0.38, 0.6, 1.2); warm.position.set(-0.58, 4.2, 1.6); warm.target.position.set(-0.58, 0.6, 0); scene.add(warm, warm.target);
const glowA = glowSprite('rgba(255,181,71,1)', 1.6, 0); glowA.position.set(-0.58, 1.55, 0.1); scene.add(glowA);
const glowB = glowSprite('rgba(255,181,71,1)', 1.8, 0); glowB.position.set(0.58, 1.55, 0.1); scene.add(glowB);

// ---------- the chart (stands to the right) ----------
const CX = 7.0; const chart = new THREE.Group(); chart.position.set(CX, 0.5, 0); scene.add(chart);
const NB = 21, BW = 0.075, STEP = 0.1, X0 = -(NB - 1) * STEP / 2;
const rOf = i => 3 + i * 0.1; const hOf = r => 0.25 + 1.75 * Math.exp(-Math.pow(r - 4.35, 2) / (2 * 0.32 * 0.32)); // illustrative shape
const bars = []; for (let i = 0; i < NB; i++) { const r = rOf(i); const inPeak = r >= 3.95 && r <= 4.75, high = r > 4.75;
  const m = inPeak ? amberM : high ? new THREE.MeshBasicMaterial({ color: new THREE.Color(RD).multiplyScalar(1.2), toneMapped: false }) : T('#5a4fc8');
  const b = new THREE.Mesh(new RoundedBoxGeometry(BW, 1, BW, 2, 0.02), m); b.position.set(X0 + i * STEP, 0.5, 0); chart.add(b); bars.push({ b, r, h: hOf(r), high }); }
const axis = new THREE.Mesh(new THREE.BoxGeometry(NB * STEP + 0.2, 0.02, 0.05), new THREE.MeshBasicMaterial({ color: '#c8ceff', toneMapped: false })); axis.position.set(0, 0.01, 0.08); chart.add(axis);
const tick = (s, r, col) => { const t = canvasTex(256, 110); t.draw((c, w, h) => txt(c, s, w / 2, h / 2 + 4, 76, col, { dir: 'ltr', font: 'Poppins' })); const m = new THREE.Mesh(new THREE.PlaneGeometry(0.36, 0.155), new THREE.MeshBasicMaterial({ map: t.tex, transparent: true, toneMapped: false })); m.position.set(X0 + (r - 3) / 0.1 * STEP, -0.17, 0.1); chart.add(m); return m; };
tick('3.0', 3, '#aab3e8'); tick('4.0', 4, AM); tick('4.7', 4.7, AM); tick('5.0', 5, RD);
const ylab = (() => { const t = canvasTex(1024, 110); t.draw((c, w, h) => txt(c, 'CHANCE OF BUYING  (illustrative)', w / 2, h / 2 + 4, 60, '#aab3e8', { dir: 'ltr', font: 'Poppins' })); const m = new THREE.Mesh(new THREE.PlaneGeometry(2.0, 0.215), new THREE.MeshBasicMaterial({ map: t.tex, transparent: true, toneMapped: false })); m.position.set(0, -0.45, 0.1); chart.add(m); return m; })();
// the hero star rides the top of the bars (the thread)
const redM = new THREE.MeshBasicMaterial({ color: new THREE.Color(RD).multiplyScalar(1.2), toneMapped: false });
const rider = new THREE.Mesh(SG, amberM); rider.scale.setScalar(1.3); scene.add(rider); const riderGlow = glowSprite('rgba(255,181,71,1)', 0.7, 0.6); scene.add(riderGlow);

// ---------- review cards around the 4.5 product ----------
const REV = [[5, 'Works great'], [5, 'Love the sound'], [2, 'Strap feels cheap'], [5, 'Worth it'], [1, 'Arrived late'], [4, 'Solid for the price']];
const cards = REV.map(([n, s], i) => { const t = canvasTex(640, 220); t.draw((c, w, h) => { c.fillStyle = n <= 2 ? '#3a1630' : '#141a52'; c.beginPath(); c.roundRect(6, 6, w - 12, h - 12, 28); c.fill(); c.strokeStyle = n <= 2 ? RD : 'rgba(62,230,255,0.7)'; c.lineWidth = 6; c.stroke();
    txt(c, '★★★★★'.slice(0, n) , 40, 70, 64, n <= 2 ? RD : AM, { dir: 'ltr', font: 'Poppins', align: 'left' }); txt(c, '★★★★★'.slice(n), 40 + n * 64 * 1.02, 70, 64, '#3a4170', { dir: 'ltr', font: 'Poppins', align: 'left' });
    txt(c, s, 40, 160, 58, '#ffffff', { dir: 'ltr', font: 'Poppins', align: 'left' }); });
  const m = new THREE.Mesh(new THREE.PlaneGeometry(0.62, 0.213), new THREE.MeshBasicMaterial({ map: t.tex, transparent: true, toneMapped: false, depthWrite: false })); scene.add(m); return { m, bad: n <= 2, i }; });
const CARD_POS = [[-0.95, 1.86], [-0.95, 1.05], [-0.22, 1.86], [-0.2, 0.52], [-0.95, 0.55], [-0.2, 1.05]];

// ---------- YOU ----------
const guy = makeToon('guy'); guy.root.scale.setScalar(0.36); guy.root.position.set(0, 0, 1.25); scene.add(guy.root);
const youTag = (() => { const t = canvasTex(256, 128); t.draw((x, w, h) => { x.fillStyle = '#c9a36b'; x.beginPath(); x.roundRect(8, 8, w - 16, h - 16, 18); x.fill(); txt(x, 'YOU', w / 2 + 8, h / 2 + 4, 70, '#2a1c08', { dir: 'ltr', font: 'Poppins' }); });
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: t.tex, toneMapped: false, depthTest: false })); s.scale.set(0.2, 0.1, 1); s.renderOrder = 5; s.position.set(0, 0.72, 1.25); scene.add(s); return s; })();

// ---------- beats ----------
installTimeline((wt, L) => ({
  why: wt(0, 'Why'), does: wt(0, 'does'), four: wt(0, 'four'), half: wt(0, 'half'), sell: wt(0, 'sell'), better: wt(0, 'better'), than: wt(0, 'than'), perfect: wt(0, 'perfect'), five: wt(0, 'five'),
  l2: L[1].start, northwestern: wt(1, 'Northwestern'), real: wt(1, 'real'), stores: wt(1, 'stores'),
  l3: L[2].start, chance: wt(2, 'chance'), peaked: wt(2, 'peaked'), four4: wt(2, 'four'), seven: wt(2, 'seven'), starsW: wt(2, 'stars'),
  l4: L[3].start, closer: wt(3, 'closer'), fiveB: wt(3, 'five'), dropped: wt(3, 'dropped'),
  l5: L[4].start, perfect2: wt(4, 'perfect'), tooGood: wt(4, 'too'), trueW: wt(4, 'true'),
  l6: L[5].start, bad: wt(5, 'bad'), good: wt(5, 'good'), feel: wt(5, 'feel'), realW: wt(5, 'real'),
  l7: L[6].start, worse: wt(6, 'worse'), its: wt(6, "It's"), believable: wt(6, 'believable'),
}), buildCam);
window.shotTimes = () => { const c = [0, B.slam, B.l3, B.l5, B.l6, B.l7, B.sig, B.end]; return c.slice(0, -1).map((x, i) => ['s' + i, x, c[i + 1]]); };

let CK = [];
function buildCam() { const bx = r => CX + X0 + (r - 3) / 0.1 * STEP;
  CK = [
    [-0.2, [0, 1.0, 4.3], [0, 1.35, 0]],
    [B.five, [0.05, 1.05, 4.75], [0, 1.3, 0]],
    [B.slam + 0.55, [0.2, 3.4, 6.2], [0, 0.7, -1.6], 'whip'],
    [B.l3 - 0.15, [-0.3, 3.0, 5.6], [0, 0.6, -1.5]],
    [B.l3 + 0.45, [CX - 0.2, 1.45, 5.2], [CX - 0.1, 1.55, 0], 'whip'],
    [B.seven, [CX + 0.05, 1.5, 4.9], [CX + 0.05, 1.6, 0]],
    [B.closer, [CX + 0.25, 1.5, 4.6], [bx(4.5), 1.6, 0]],
    [B.l5 - 0.1, [bx(4.7), 1.45, 4.2], [bx(4.7), 1.5, 0]],
    [B.l5 + 0.45, [0.6, 1.45, 2.4], [0.58, 1.3, 0], 'whip'],
    [B.l6 - 0.1, [0.5, 1.5, 2.25], [0.58, 1.35, 0]],
    [B.l6 + 0.45, [-0.55, 1.25, 3.6], [-0.55, 1.2, 0], 'whip'],
    [B.l7 - 0.1, [-0.45, 1.3, 3.4], [-0.55, 1.2, 0]],
    [B.l7 + 0.5, [0, 1.05, 4.9], [0, 1.3, 0], 'whip'],
    [B.sig - 0.05, [0, 1.15, 4.6], [0, 1.3, 0]],
    [B.sig + 0.4, [0, 4.5, 4.0], [0, 0.6, 0]],
    [B.end + 1, [0, 4.8, 3.9], [0, 0.6, 0]],
  ]; }

// ---------- per frame ----------
function props(t) {
  // hook: both rows light up star by star on "four and a half" / "perfect five"
  const litA = seg(t, B.four - 0.1, B.half - B.four + 0.2), litB = seg(t, B.perfect - 0.1, B.five - B.perfect + 0.25);
  PA.row.stars.forEach((s, i) => { if (s.lit) s.lit.scale.setScalar(easeB(clamp(litA * 5 - i)) + 0.001); });
  PB.row.stars.forEach((s, i) => { if (s.lit) s.lit.scale.setScalar(easeB(clamp(litB * 5 - i)) + 0.001); });
  [PA, PB].forEach((p, k) => { p.core.rotation.y = t * 0.6 + k; });
  // L5: the perfect row overglows, an x-ray scan crosses it, and it turns grey (doubted)
  const doubt = seg(t, B.trueW - 0.1, 0.5); const over = t > B.perfect2 - 0.1 && t < B.trueW ? 0.7 + 0.3 * Math.sin((t - B.perfect2) * 9) : 0;
  glowB.material.opacity = Math.max(over, t < B.slam && t > B.five - 0.1 ? 0.5 : 0) * (1 - doubt);
  PB.row.stars.forEach(s => { if (s.lit) s.lit.material = doubt > 0.5 ? greyStar : amberM; });
  PB.em.color.set(doubt > 0.5 ? '#ff6a80' : CY); PB.box.material.opacity = 0.38 - 0.18 * doubt;
  // L7: warm spotlight on the 4.5 product
  const win = eio(seg(t, B.l7 - 0.05, 0.6)); warm.intensity = 30 * win; glowA.material.opacity = 0.55 * win + (t < B.slam && t > B.half ? 0.4 : 0);
  // chart: bars to 4.7 grow on line 3, the last three on line 4
  bars.forEach((o, i) => { const at = o.high ? B.closer + (i - 18) * 0.18 : B.chance + i * ((B.starsW - B.chance) / 18); const k = eo(seg(t, at, 0.35)); const h = Math.max(0.001, o.h * k); o.b.scale.y = h; o.b.position.y = h / 2; });
  // rider star: follows the top of the grown bars, settles on the peak, then slides down to 5.0
  const ri = t < B.closer ? lerp(0, 13, eio(seg(t, B.chance, B.seven - B.chance + 0.3))) : lerp(13, 20, eio(seg(t, B.closer, B.dropped - B.closer + 0.3)));
  const r = 3 + ri * 0.1, i0 = Math.floor(ri), i1 = Math.min(20, i0 + 1), rh = lerp(bars[i0].b.scale.y, bars[i1].b.scale.y, ri - i0);
  rider.position.set(CX + X0 + ri * STEP, Math.max(0.12, rh) + 0.68, 0.05); rider.rotation.y = t * 2; riderGlow.position.copy(rider.position);
  const rv = t > B.chance - 0.1 && t < B.l5 + 0.3; rider.visible = rv; riderGlow.visible = rv; rider.material = r > 4.75 ? redM : amberM;
  // review cards pop around the 4.5 product: good ones first, then the bad ones land on "bad"
  cards.forEach(c => { const at = c.bad ? B.bad - 0.05 + (c.i === 4 ? 0.12 : 0) : B.l6 - 0.05 + c.i * 0.07; const k = easeB(seg(t, at, 0.3)); const out = seg(t, B.l7 + 0.2, 0.3);
    const [x, y] = CARD_POS[c.i]; c.m.position.set(x, y + 0.02 * Math.sin(t * 2 + c.i), 0.35 + (c.bad ? 0.08 : 0)); c.m.scale.setScalar(Math.max(0.001, k * (1 - out))); c.m.visible = k > 0 && out < 1; });
  // YOU: looks between the products, doubts the 5.0, picks the 4.5
  const look = t < B.half ? -0.5 : t < B.perfect ? -0.4 : t < B.slam ? 0.45 : t > B.l5 && t < B.l6 ? 0.55 : t > B.l6 ? -0.6 : 0;
  guy.root.rotation.y = lerp(guy.root.rotation.y, look, 0.25); guy.root.position.x = 0; youTag.position.x = guy.root.position.x;
  guy.update(t, { pose: 'idle', mood: t > B.l7 ? 'happy' : t > B.tooGood && t < B.l6 + 0.4 ? 'worried' : t < B.slam ? 'surprised' : 'neutral' });
  youTag.visible = t < B.l3 || t > B.l5;
}

// ---------- type ----------
function drawType(t) {
  hook(t, [[['WHY', 'why'], ['DOES', 'does'], ['4.5', 'four', AM]], [['SELL', 'sell'], ['BETTER', 'better']], [['THAN', 'than'], ['5.0?', 'perfect', RD]]], [300, 470, 640], [170, 160, 170]);
  superAt(t, 'REAL ONLINE STORES', B.real - 0.05, B.l3 - B.real + 0.05, 300, 120, CY);
  if (t > B.l2 && t < B.l3 + 0.05) foot('Spiegel Research Center, Northwestern University (2017)', clamp((t - B.l2) / 0.3) * clamp((B.l3 + 0.05 - t) / 0.2));
  superAt(t, 'BUYING PEAKS', B.peaked - 0.05, B.four4 - B.peaked, 300, 150);
  if (t > B.four4 - 0.1 && t < B.l4 + 0.05) line([['4.0', B.four4, AM], ['–', B.four4 + 0.2], ['4.7', B.seven, AM]], 310, 200, t, { a: clamp((B.l4 + 0.05 - t) / 0.14) });
  superAt(t, 'CLOSER TO 5…', B.closer - 0.05, B.dropped - B.closer, 300, 150);
  superAt(t, 'IT DROPS', B.dropped - 0.05, B.l5 - B.dropped + 0.1, 300, 165, RD);
    superAt(t, 'TOO GOOD', B.tooGood - 0.05, B.l6 - B.tooGood + 0.05, 300, 200, RD); superAt(t, 'TO BE TRUE?', B.tooGood + 0.25, B.l6 - B.tooGood - 0.2, 480, 130);
  superAt(t, 'BAD REVIEWS', B.bad - 0.05, B.good - B.bad, 250, 150, RD);
  superAt(t, 'FEEL REAL', B.good, B.l7 - B.good + 0.05, 250, 170, CY);
  superAt(t, "ISN'T WORSE.", B.worse - 0.15, B.believable - B.worse + 0.05, 300, 160);
  if (t > B.believable - 0.1 && t < B.sig + 0.25) line([['BELIEVABLE', B.believable, AM]], 300, 170, t, { a: clamp((B.sig + 0.25 - t) / 0.15) });
}

// ---------- sound ----------
window.getEvents = () => { const { ev, done } = eventsHelper();
  for (const k of ['why', 'does', 'sell', 'better', 'than']) ev(B[k], 'tick', 0.8); for (let i = 0; i < 5; i++) ev(B.four - 0.1 + i * (B.half - B.four + 0.2) / 5, 'pop2', 0.5); ev(B.four, 'pop', 1);
  for (let i = 0; i < 5; i++) ev(B.perfect - 0.1 + i * (B.five - B.perfect + 0.25) / 5, 'pop2', 0.5); ev(B.perfect, 'pop', 1);
  ev(B.slam, 'slam', 1.2); ev(B.slam, 'whoosh', 1); ev(B.real - 0.05, 'super');
  ev(B.l3 + 0.1, 'whoosh'); ev(B.peaked - 0.05, 'super', 0.8); for (let i = 0; i < 18; i += 2) ev(B.chance + i * ((B.starsW - B.chance) / 18), 'tick', 0.45); ev(B.four4, 'pop', 0.9); ev(B.seven, 'pop', 1); ev(B.seven + 0.05, 'slam', 0.6);
  ev(B.closer - 0.05, 'super', 0.7); for (let i = 0; i < 3; i++) ev(B.closer + i * 0.18, 'pop2', 0.5); ev(B.dropped - 0.05, 'slam', 0.8);
  ev(B.l5 + 0.1, 'whoosh'); ev(B.tooGood - 0.05, 'super'); ev(B.trueW, 'slam', 0.7);
  ev(B.l6 + 0.1, 'whoosh'); for (let i = 0; i < 4; i++) ev(B.l6 - 0.05 + i * 0.07, 'card', 0.5); ev(B.bad - 0.05, 'pop', 1); ev(B.bad + 0.07, 'pop', 0.9); ev(B.good, 'super', 0.8);
  ev(B.l7 + 0.1, 'whoosh', 1.1); ev(B.worse - 0.15, 'super', 0.7); ev(B.believable, 'slam', 0.8);
  sigEvents(ev); return done(); };

window.renderAt = t => {
  camAt(t, CK, { shakes: [B.slam, B.dropped] });
  props(t);
  bloom.strength = 0.6 + (t > B.slam ? 0.45 * Math.exp(-(t - B.slam) * 7) : 0);
  composer.render(); ui.clearRect(0, 0, W, H); drawType(t); signature(t, 'Source: Spiegel Research Center, Northwestern University (2017)', RD); filmLook(t); return 'f';
};
window.ready = Promise.resolve(true);
</script></body></html>
