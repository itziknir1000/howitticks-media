let CK = [];

// presses: [time, kind] kind 'hook' (✕ on the button), 'block' (pulse bounces off the timer lock), 'fire' (pulse runs to the motor)
let PR = [];
function buildPress() { PR = [[-0.1, 'hook'], [0.32, 'hook'], [0.62, 'hook'], [B.close - 0.05, 'hook'], [B.anything, 'hook'],
  [B.l2 + 0.2, 'block'], [B.timer, 'block'], [B.pressing - 0.05, 'block'], [B.pressing + 0.42, 'block'], [B.cut - 0.05, 'block'], [B.short + 0.2, 'block'], [B.keyW + 0.1, 'fire'], [B.you - 0.05, 'block']]; }
const lastPress = t => { let p = null; for (const q of PR) if (t >= q[0]) p = q; return p; };
const fireA = t => seg(t, B.keyW - 0.15, 0.35) * (1 - seg(t, B.just - 0.1, 0.2)); // fire mode (key turned) until line 6
const TH0 = () => B.three - 0.35; const remain = t => clamp(3 - (t - TH0()), 0, 3);
const doorOpenAt = t => { const shut0 = TH0() + 3.15; // normal close after the hold, slow; fire press closes fast; reopens on line 6
  let o = 1 - eio(seg(t, B.keyW + 0.72, 0.3)); if (t > B.just + 0.1) o = eio(seg(t, B.just + 0.1, 0.6)); return o; };

function drawTimer(t) {
  const xr = xray(t); const r = remain(t), running = t > TH0() && t < TH0() + 3.05, fa = fireA(t);
  TD.draw((x, w, h) => { x.clearRect(0, 0, w, h); x.globalAlpha = xr; x.fillStyle = 'rgba(6,9,32,0.9)'; x.beginPath(); x.roundRect(4, 4, w - 8, h - 8, 36); x.fill();
    x.font = '700 44px Poppins'; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillStyle = '#aab3e8'; x.fillText('DOOR TIMER', w / 2, 52);
    const cx = w / 2 - 70, cy = 240, R = 110; x.lineWidth = 22; x.strokeStyle = 'rgba(155,107,255,0.25)'; x.beginPath(); x.arc(cx, cy, R, 0, 7); x.stroke();
    const frac = t < TH0() ? 1 : r / 3; x.strokeStyle = AM; x.shadowColor = AM; x.shadowBlur = 20; x.beginPath(); x.arc(cx, cy, R, -Math.PI / 2, -Math.PI / 2 + frac * Math.PI * 2); x.stroke(); x.shadowBlur = 0;
    x.fillStyle = '#ffffff'; x.font = '700 120px Poppins'; x.fillText(t < TH0() ? '3' : String(Math.ceil(r - 1e-3)), cx, cy + 6);

const xray = t => t < B.slam ? 0.0 : eio(seg(t, B.slam, 0.4)) * (1 - seg(t, B.sig, 0.3));

}

// ---------- type ----------
function drawType(t) {
  { const g = ui.createLinearGradient(0, 0, 0, 780); g.addColorStop(0, 'rgba(2,3,12,0.5)'); g.addColorStop(1, 'rgba(2,3,12,0)'); ui.fillStyle = g; ui.fillRect(0, 0, W, 780); }
  // frame 0: the whole question is already on screen; it breathes, CLOSE flashes on every press, and it is blown away on the slam

    ui.save(); ui.translate(540, 455); ui.scale(1 + 0.07 * kick, 1 + 0.07 * kick); ui.translate(-540, -455); line([['CLOSE', -1, AM], ['BUTTON', -1]], 455, 170, 5, o); ui.restore();
    line([['DO', -1], ['ANYTHING?', -1, CY]], 610, 130, 5, o); ui.restore(); }

  superAt(t, 'IN THE U.S.', B.inW - 0.05, B.timer - B.inW - 0.05, 300, 120, CY);
